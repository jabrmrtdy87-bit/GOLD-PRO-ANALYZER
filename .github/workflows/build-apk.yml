name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # ✅ الحل: تثبيت libtinfo5 يدويًا قبل تثبيت باقي التبعيات
      - name: Install libtinfo5 manually for Ubuntu 24.04
        run: |
          wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.2_amd64.deb
          sudo apt install -y ./libtinfo5_6.3-2ubuntu0.2_amd64.deb

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # ملاحظة: تم إزالة libtinfo5 من هذه القائمة لأننا ثبتناها يدويًا في الخطوة السابقة
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install cython==0.29.33

      # ✅ قبول تراخيص Android SDK عبر مدير SDK الخاص بـ Buildozer
      - name: Accept Android SDK Licenses
        run: |
          BUILD_OZER_SDK=~/.buildozer/android/platform/android-sdk
          mkdir -p $BUILD_OZER_SDK/licenses
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gold-pro-apk
          path: bin/*.apk
