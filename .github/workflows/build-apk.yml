name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    # ✅ التغيير الأهم: استخدام إصدار 22.04 بدلاً من latest لتجنب مشاكل الحزم
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # الآن libtinfo5 ستُثبت بنجاح لأننا على ubuntu-22.04
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install cython==0.29.33

      # ✅ قبول تراخيص Android SDK لضمان تثبيت build-tools و aidl
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;31.0.0" || true

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gold-pro-apk
          path: bin/*.apk
