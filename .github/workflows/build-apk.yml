name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install cython==0.29.33

      # ✅ الحل الجذري: إنشاء ملفات الترخيص في مسار Buildozer الصحيح
      - name: Pre-accept Android SDK Licenses for Buildozer
        run: |
          BUILD_OZER_SDK=~/.buildozer/android/platform/android-sdk
          mkdir -p $BUILD_OZER_SDK/licenses
          echo -e "\n8933bad161af4b6a5b573652ffc7aaf3aee85a47" > $BUILD_OZER_SDK/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" > $BUILD_OZER_SDK/licenses/android-sdk-preview-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $BUILD_OZER_SDK/licenses/google-tv-preview-license

      # ✅ تمرير yes لأي طلب تفاعلي متبقٍ أثناء البناء
      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gold-pro-apk
          path: bin/*.apk
