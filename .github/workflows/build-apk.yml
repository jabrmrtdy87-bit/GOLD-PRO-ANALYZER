name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install cython==0.29.33

      # ✅ الحل الجذري: استخدام sdkmanager الخاص بـ Buildozer مع تمرير yes
      - name: Accept Licenses via Buildozer's SDK Manager
        run: |
          # تحديد مسار SDK الذي يستخدمه Buildozer
          BUILD_OZER_SDK=~/.buildozer/android/platform/android-sdk
          # إنشاء مجلد الترخيص إذا لم يكن موجودًا
          mkdir -p $BUILD_OZER_SDK/licenses
          # قبول جميع التراخيص باستخدام sdkmanager الخاص بـ Buildozer
          if [ -f "$BUILD_OZER_SDK/tools/bin/sdkmanager" ]; then
            yes | $BUILD_OZER_SDK/tools/bin/sdkmanager --licenses --sdk_root=$BUILD_OZER_SDK
          elif [ -f "$BUILD_OZER_SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | $BUILD_OZER_SDK/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$BUILD_OZER_SDK
          else
            echo "sdkmanager not found in Buildozer's SDK path. Trying system sdkmanager..."
            yes | sdkmanager --licenses
          fi
          # تثبيت build-tools لضمان وجود aidl
          yes | $BUILD_OZER_SDK/tools/bin/sdkmanager "build-tools;31.0.0" --sdk_root=$BUILD_OZER_SDK || true

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gold-pro-apk
          path: bin/*.apk
