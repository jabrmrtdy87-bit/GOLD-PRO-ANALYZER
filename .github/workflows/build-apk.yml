name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install cython==0.29.33

      # ✅ الحل الجذري: تثبيت أدوات سطر الأوامر وإنشاء رابط رمزي للمسار القديم
      - name: Install and Link Android Command-line Tools
        run: |
          SDK_ROOT=~/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_ROOT
          # تحميل أحدث أدوات سطر الأوامر من جوجل
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          mkdir -p $SDK_ROOT/cmdline-tools
          unzip -q cmdline-tools.zip -d $SDK_ROOT/cmdline-tools
          mv $SDK_ROOT/cmdline-tools/cmdline-tools $SDK_ROOT/cmdline-tools/latest

          # إنشاء مجلد tools/bin القديم وإنشاء رابط رمزي لـ sdkmanager بداخله
          mkdir -p $SDK_ROOT/tools/bin
          ln -sf $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $SDK_ROOT/tools/bin/sdkmanager

          # إنشاء ملفات الترخيص في المسار الصحيح
          mkdir -p $SDK_ROOT/licenses
          echo -e "\n8933bad161af4b6a5b573652ffc7aaf3aee85a47" > $SDK_ROOT/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" > $SDK_ROOT/licenses/android-sdk-preview-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $SDK_ROOT/licenses/google-tv-preview-license

      # ✅ قبول التراخيص باستخدام sdkmanager المثبت حديثاً (بدون yes |)
      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT=~/.buildozer/android/platform/android-sdk
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;31.0.0" || true

      # ✅ البناء
      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gold-pro-apk
          path: bin/*.apk
