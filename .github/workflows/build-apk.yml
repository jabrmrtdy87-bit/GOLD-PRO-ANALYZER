name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install system dependencies
        run: |
          echo "deb http://archive.ubuntu.com/ubuntu jammy universe" | sudo tee /etc/apt/sources.list.d/jammy-temp.list
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install cython==0.29.33

      # ✅ قبول التراخيص مسبقًا لضمان وجود ملفات الترخيص
      - name: Accept Android SDK Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;31.0.0" "platform-tools" || true

      # ✅ التحقق من وجود aidl وملفات الترخيص قبل البناء
      - name: Verify aidl and Licenses
        run: |
          echo "--- Checking for aidl ---"
          which aidl || echo "aidl not in PATH yet"
          echo "--- Checking license files ---"
          ls -la $ANDROID_HOME/licenses/ || echo "No licenses folder found"
          echo "--- Checking build-tools folder ---"
          ls -la $ANDROID_HOME/build-tools/ || echo "No build-tools folder found"

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gold-pro-apk
          path: bin/*.apk
